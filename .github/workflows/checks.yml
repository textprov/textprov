name: Proposal and SDK demonstrations

on:
  push:
    branches: [main, wip/textprov-proposal]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/check_docs.py
      - name: Shared reveal stylesheet
        run: python tools/sync_display_styles.py --check
      - name: License copies
        run: |
          diff -q python/LICENSE js/LICENSE
          diff -q python/LICENSE ruby/LICENSE

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
        working-directory: js
      - run: npm test
        working-directory: js

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t .
        working-directory: python
      - name: Codex adapter fixtures
        run: python -m unittest discover -s plugins/codex/tests -v
        env:
          PYTHONPATH: python
      - name: Install the local core package
        run: python -m pip install ./python
      - name: Installed package contract
        run: |
          python -c 'import importlib.metadata, textprov; from textprov.chronicle import Chronicle; from textprov.prose import ProseEditor; assert textprov.__version__ == importlib.metadata.version("textprov"); assert callable(Chronicle.transfer)'

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rake test
        working-directory: ruby

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
