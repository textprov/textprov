[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textprov"
version = "0.1.0"
description = "Put provenance marks in text, and read them back out"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["provenance", "attribution", "ai", "variation-selector", "textprov"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = []

[project.scripts]
textprov = "textprov.__main__:main"

[project.urls]
Homepage = "https://github.com/textprov/textprov"
Specification = "https://github.com/textprov/textprov/blob/main/SPEC.md"

[tool.setuptools]
packages = ["textprov"]

[tool.setuptools.package-data]
textprov = ["mapping.json"]
