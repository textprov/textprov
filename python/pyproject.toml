# python/pyproject.toml

[project]
name = "textprov"
version = "0.1.2"
description = "Label AI output down to the character, directly in ordinary Unicode text."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "attribution", "provenance", "textprov", "variation-selector"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/textprov/textprov"
Specification = "https://github.com/textprov/textprov/blob/main/SPEC.md"

[project.scripts]
textprov = "textprov.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["textprov"]

[tool.setuptools.package-data]
textprov = ["mapping.json"]
